name: build inotify-tools (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool m4 wget ca-certificates pkg-config

      - name: Download source
        run: |
          wget -q -O inotify-tools-3.20.11.0.tar.gz https://github.com/inotify-tools/inotify-tools/archive/refs/tags/3.20.11.0.tar.gz
          tar xzf inotify-tools-3.20.11.0.tar.gz

      - name: Build
        run: |
          cd inotify-tools-3.20.11.0
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc)
          cp src/inotifywait src/inotifywatch $GITHUB_WORKSPACE/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inotify-tools-bin
          path: |
            inotifywait
            inotifywatch
